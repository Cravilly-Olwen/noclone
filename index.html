<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Bibliothèque Supabase : crée la variable globale « supabase » -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <!-- Client Supabase du projet : crée « supabaseClient » -->
    <script src="assets/js/spclient.js"></script>
    <!-- Pop-up d'inscription, puis inscription et connexion -->
    <script type="module" src="assets/js/accueil.js"></script>
    <title>Accueil - Noclone</title>
</head>
<body>
    <main>
        <!-- Connexion, affichée directement sur la page -->
        <h1>Se connecter</h1>
        <form id="form-connexion">
            <button type="submit">Se connecter avec ma passkey</button>
            <p id="statut-connexion" role="status"></p>
        </form>

        <p>Pas encore client ? <button type="button" data-ouvrir="fenetre-inscription">Ouvrir un compte</button></p>
    </main>

    <!-- Pop-up d'inscription -->
    <dialog id="fenetre-inscription">
        <button type="button" data-fermer>Fermer</button>
        <h2>Ouvrir un compte</h2>
        <form id="form-inscription">
            <label for="prenom">Prénom</label>
            <input id="prenom" name="prenom" autocomplete="given-name" maxlength="50" required>

            <label for="nom">Nom</label>
            <input id="nom" name="nom" autocomplete="family-name" maxlength="50" required>

            <label for="courriel">Courriel</label>
            <input id="courriel" name="courriel" type="email" autocomplete="email" maxlength="254" required>

            <button type="submit">Créer ma passkey</button>
            <p id="statut-inscription" role="status"></p>
        </form>
    </dialog>
</body>
</html>
